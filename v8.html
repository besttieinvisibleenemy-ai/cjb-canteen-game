<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#11161b">
<title>CJB Canteen Supervisor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2329;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;border:0;border-radius:8px;padding:6px 10px;background:#2f3b46;color:#eef;cursor:pointer;touch-action:manipulation}
button:hover{filter:brightness(1.15)}
button.on{background:#e8a33d;color:#111}
button:disabled{opacity:.4;cursor:default}
button.primary{background:#2e7d32}
button.danger{background:#a63a32}
input,select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid #445;background:#0f1418;color:#eef}
#hud{position:fixed;top:0;left:0;right:0;padding:5px 8px 6px;background:linear-gradient(#11161bf5,#11161bdd);z-index:10;font-size:12.5px;user-select:none}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#clock{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:56px}
#speedBtns button{padding:4px 8px;min-width:34px}
#phase{font-weight:700;color:#ffd38a}
#dateInfo{opacity:.8;margin-left:auto}
.meter{background:#232c35;border-radius:8px;padding:3px 7px;white-space:nowrap;cursor:pointer}
.meter b{font-variant-numeric:tabular-nums}
.warn{color:#ff8a65!important}
.good{color:#8bd36b}
#prog{position:relative;height:16px;background:#2a333c;border-radius:8px;margin-top:5px;overflow:hidden}
#progFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#2f8f4a,#8bd36b);transition:width .4s}
.pline{position:absolute;top:0;bottom:0;width:3px}
#lineMin{background:#ffd54f}#lineBE{background:#ef5350}
#progText{position:absolute;left:6px;right:6px;top:1px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-shadow:0 0 3px #000}
#alerts{position:fixed;left:8px;bottom:64px;z-index:9;display:flex;flex-direction:column;gap:5px;max-width:min(440px,calc(100% - 16px));pointer-events:none}
.alert{background:#5d2b1fee;border-left:4px solid #ff7043;border-radius:8px;padding:6px 9px;font-size:12.5px;pointer-events:auto}
.alert.ok{background:#1f4d2bee;border-color:#66bb6a}
.alert .chk{display:inline-block;margin-right:8px}
#panel{position:fixed;right:0;top:var(--hudh,92px);bottom:56px;width:310px;overflow:auto;background:#141a20ee;padding:8px 10px;z-index:9;font-size:12.5px;-webkit-overflow-scrolling:touch}
#panel h3{margin:10px 0 4px;font-size:13px;color:#ffd38a;border-bottom:1px solid #334;padding-bottom:2px}
#panel table{width:100%;border-collapse:collapse}
#panel td{padding:2px 3px;vertical-align:middle}
#panel td.n{text-align:right;font-variant-numeric:tabular-nums}
#panel button{padding:3px 7px;font-size:12px}
.bar{height:7px;background:#2a333c;border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:#66bb6a}
#actionbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#11161bf2;z-index:11}
#actionbar button{flex:1;padding:10px 4px;font-weight:700;font-size:14px}
#btnBill{background:#2e7d32}
#btnBill.busy{background:#c62828;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.35)}}
@media (max-width:820px){
  #panel{width:100%;top:auto;height:58vh;bottom:56px;transform:translateY(120%);transition:transform .25s;border-radius:14px 14px 0 0}
  #panel.open{transform:none}
  #dateInfo{margin-left:0}
}
@media (min-width:821px){#btnPanel{display:none}#alerts{right:320px}}
#autoBtn{padding:4px 9px;font-weight:800;background:#37474f}
body.auto-on #autoBtn{background:#2e7d32;box-shadow:0 0 0 2px #8bd36b inset}
#skipBtn{padding:4px 8px;display:none}body.auto-on #skipBtn{display:inline-block}
#shiftMini{position:fixed;left:8px;top:var(--hudh,92px);z-index:9;background:#11161be6;border-left:4px solid #8bd36b;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;max-width:260px}
#fastOv{position:fixed;inset:0;z-index:40;background:#0b0f13d9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;font-size:15px;padding:20px;text-align:center}
#fastOv .fb{width:min(420px,86vw);height:14px;background:#2a333c;border-radius:7px;overflow:hidden}#fastBar{height:100%;width:0;background:linear-gradient(90deg,#2f8f4a,#8bd36b)}
.schart{margin:6px 0 8px}.sbar{display:grid;grid-template-columns:minmax(118px,34%) 1fr auto;gap:8px;align-items:center;margin:3px 0;font-size:12.5px}
.strack{height:14px;background:#2a333c;border-radius:7px;overflow:hidden}.strack i{display:block;height:100%;border-radius:7px}
.sbar b{min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
table.stable td,table.stable th{padding:4px 5px;border-bottom:1px solid #2c3640;font-size:12.5px}
table.stable th{color:#9fb0bf;font-weight:600;text-align:left}table.stable .n{text-align:right;font-variant-numeric:tabular-nums}
table.stable tr.tot td{border-top:2px solid #556;background:#ffffff08}table.stable tr.cur td{background:#2e7d3233}
.dot{display:inline-block;width:9px;height:9px;border-radius:5px;margin-right:5px}
.tabs{display:flex;gap:6px;margin:4px 0 8px}.tabs button.on{background:#2e7d32}
.sh3{margin:10px 0 4px;font-size:14px;color:#ffd38a}.small{font-size:11.5px}.scroll{overflow:auto;max-width:100%}
#panel .stable td{padding:2px 3px;font-size:12px}
.alog{font-size:11px;color:#b8c7d3;line-height:1.35;max-height:96px;overflow:hidden}
@media (max-width:820px){#shiftMini{max-width:190px;font-size:11px}#actionbar button{font-size:13px}}
#modal{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:center;justify-content:center;padding:8px}
#modalBox{background:#1e262e;border-radius:14px;max-width:680px;width:100%;max-height:94vh;overflow:auto;padding:14px;box-shadow:0 10px 40px #000a;font-size:14px}
#modalBox h2{margin:0 0 8px;font-size:18px;color:#ffd38a}
#modalBox table{width:100%;border-collapse:collapse;font-size:13px}
#modalBox td,#modalBox th{padding:3px 5px;border-bottom:1px solid #2c3640;text-align:left}
#modalBox td.n,#modalBox th.n{text-align:right;font-variant-numeric:tabular-nums}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btnrow button{flex:1;min-width:120px;padding:10px}
.hidden{display:none!important}
.muted{opacity:.7;font-size:12px}
/* POS */
.cust{display:flex;gap:10px;align-items:center;background:#27313b;border-radius:10px;padding:8px}
.badge{width:86px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;text-align:center;color:#fff;flex:none;border:2px solid #fff4}
.badge.green{background:#2e7d32}.badge.blue{background:#1565c0}.badge.pax{background:#fff;color:#222;border:2px dashed #888}
.speech{flex:1;font-size:14px}
.tiers{display:flex;gap:6px;margin:8px 0}
.tiers button{flex:1;padding:9px 4px}
.tiers .tg.on{background:#43a047;color:#fff}.tiers .tb.on{background:#1e88e5;color:#fff}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:5px;max-height:34vh;overflow:auto;padding:2px}
.items button{padding:6px 4px;font-size:12px;line-height:1.2;text-align:left;background:#2b3742}
.items button small{display:block;opacity:.75}
.cart{margin-top:8px;background:#151b21;border-radius:8px;padding:6px;font-size:13px}
.cart div{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
.cart button{padding:1px 8px}
.total{font-size:18px;font-weight:800;text-align:right;margin-top:4px}
.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.notes button{padding:10px 2px;font-weight:700;background:#3b4a35}
/* wheel */
#wheel{position:fixed;z-index:25;width:250px;height:250px;margin:-125px 0 0 -125px;pointer-events:none}
#wheel .hub{position:absolute;left:65px;top:80px;width:120px;min-height:90px;background:#141a20f2;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:8px;pointer-events:auto;border:2px solid #e8a33d}
#wheel .opt{position:absolute;width:92px;margin-left:-46px;margin-top:-20px;padding:6px 4px;font-size:11px;line-height:1.15;border-radius:12px;background:#2f3b46f5;pointer-events:auto;box-shadow:0 2px 8px #0008}
#wheel .opt.close{background:#6d2a2a}
#toast{position:fixed;left:50%;top:calc(var(--hudh,92px) + 2px);transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:min(92vw,520px)}
#toast div{background:#000d;border-radius:8px;padding:6px 12px;font-size:13px;animation:fade 3.2s forwards;text-align:center}
@keyframes fade{0%{opacity:0;transform:translateY(8px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
body.modal-open #toast{top:4px}
body.focus-board #panel,body.focus-board #alerts,body.focus-board #wheel{display:none!important}
#boardBack{position:fixed;right:12px;bottom:72px;z-index:20;padding:12px 18px;font-weight:700;background:#e8a33d;color:#111;box-shadow:0 4px 16px #0008}
.rl-table td{font-size:15px;padding:5px 6px!important}.rl-table tr.now td{background:#1f4d2b;color:#fff;font-weight:700}.rl-table tr.off td{opacity:.55}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;z-index:50;background:#1d2329}
</style>
</head>
<body>
<div id="loading">Loading CJB Canteen Supervisor…</div>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row">
    <div id="clock">07:00</div>
    <div id="speedBtns"><button data-s="0" title="Pause">⏸</button><button data-s="1">1x</button><button data-s="2">2x</button><button data-s="4">4x</button><button data-s="8">8x</button></div>
    <button id="autoBtn" title="AI supervisor runs the canteen">🤖 AUTO</button><button id="skipBtn" title="Fast-simulate the rest of the day">⏭ Day</button>
    <button id="qBtn" title="Graphics quality (Low / High)" style="padding:4px 8px">HQ</button>
    <div id="phase">—</div>
    <div id="dateInfo">—</div>
  </div>
  <div class="row" style="margin-top:4px">
    <div class="meter" id="mLpg" title="LPG cylinder – tap to swap/order">🔥 LPG <b>100%</b></div>
    <div class="meter" id="mBoiler" title="Gas tea boiler">☕ <b>0L</b></div>
    <div class="meter" id="mCash">💰 <b>₹0</b></div>
    <div class="meter" id="mSat" title="Customer satisfaction">🙂 <b>70</b></div>
    <div class="meter" id="mHyg" title="Hygiene (lowest area)">🧽 <b>80</b></div>
  </div>
  <div id="prog"><div id="progFill"></div><div class="pline" id="lineMin"></div><div class="pline" id="lineBE"></div><div id="progText"></div></div>
</div>
<div id="alerts"></div>
<div id="panel"></div>
<div id="actionbar">
  <button id="btnBill">🧾 Bill <span id="qCount">0</span></button>
  <button id="btnStore">🍽 Menu</button>
  <button id="btnRates">👥 Visitors</button>
  <button id="btnShifts">📊 Shifts</button>
  <button id="btnPanel">☰ More</button>
</div>
<div id="modal" class="hidden"><div id="modalBox"></div></div>
<div id="wheel" class="hidden"></div>
<div id="toast"></div>
<div id="shiftMini" class="hidden"></div>
<div id="fastOv" class="hidden"><div>⏩ Fast simulation – same game rules, no 3D drawing</div><div class="fb"><div id="fastBar"></div></div><div id="fastTxt"></div></div>
<button id="boardBack" class="hidden">✖ Back to the canteen</button>
